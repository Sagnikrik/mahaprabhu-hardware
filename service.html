<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Services</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #f5f5f5;
        }

        .services-page {

            max-width: 500px;
            margin: 100px auto;
            padding: 20px;

        }

        .services-page h1 {

            text-align: center;
            margin-bottom: 50px;

        }

        .service-grid {

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;

        }

        .service-card {

            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .1);

        }

        .service-card h2 {

            margin-bottom: 15px;

        }

        .service-card p {

            margin-bottom: 20px;

        }

        .service-card a {

            display: inline-block;
            padding: 12px 25px;
            background: #ff9800;
            color: white;
            text-decoration: none;
            border-radius: 30px;

        }

        .service-card a:hover {

            background: #ff7300;

        }
    </style>

</head>

<body>

    <div class="services-page">

        <h1>Our Services</h1>

        <div class="service-grid">

            <div class="service-card">

                <h2>Bill Search</h2>

                <p>Search and download your purchase bill.</p>

                <a href="billsearch.html">

                    Open

                </a>

            </div>

        </div>

    </div>

</body>

</html>
