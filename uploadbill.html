<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Bill</title>

    <link rel="stylesheet" href="uploadbill.css">

</head>

<body>

<div class="container">

    <h2>Upload Customer Bill</h2>

    <input
        type="text"
        id="billNumber"
        placeholder="Enter Bill Number">

    <div class="file-upload">

        <label for="billPdf">
            📄 Choose Bill PDF
        </label>

        <input
            type="file"
            id="billPdf"
            accept=".pdf">

        <span id="fileName">
            No file selected
        </span>

    </div>

    <div class="progress">

        <div class="progress-bar" id="progressBar"></div>

    </div>

    <button id="uploadBtn">

        Upload Bill

    </button>

    <p id="status"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="module" src="uploadbill.js"></script>

</body>

</html>
